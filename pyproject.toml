[project]
name = "bioformats-to-incarta-app"
version = "1.0.0"
description = "Command line and window for Bio-Formats to IN Carta, run through jgo without Fiji"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE.txt"]
authors = [{ name = "Nicolas Chiaruttini" }]
requires-python = ">=3.10"
dependencies = [
    "jgo[cli]>=3.1",
    "psutil",
]

[project.scripts]
bioformats-to-incarta = "bioformats_to_incarta_app.cli:main"

[project.gui-scripts]
bioformats-to-incarta-gui = "bioformats_to_incarta_app.gui:main"

[project.urls]
Converter = "https://github.com/unige-biochem/bioformats-to-incarta"

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bioformats_to_incarta_app"]

[tool.pytest.ini_options]
markers = ["jvm: starts a real JVM through jgo (slow the first time)"]
